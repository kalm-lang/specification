name: Release specification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional specification version in X.Y.Z format. Empty uses the latest final version.'
        required: false
        type: string
      status:
        description: 'Release status'
        required: false
        type: string
        default: 'final'

permissions:
  contents: write
  packages: write

concurrency:
  group: specification-release
  queue: max

jobs:
  publish:
    name: Publish specification packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KALM_PACKAGES_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and GitHub Packages authentication
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@kalm-lang'
          cache: npm

      - name: Install Node.js build dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund --fetch-retries=0

      - name: Resolve and validate release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_STATUS: ${{ inputs.status }}
          TAG_NAME: ${{ github.ref_name }}
        run: npm run --silent release:resolve >> "$GITHUB_OUTPUT"

      - name: Reject an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if release_output=$(gh release view "$RELEASE_TAG" 2>&1); then
            echo "A GitHub release already exists for $RELEASE_TAG" >&2
            exit 1
          else
            release_status=$?
            if [[ "$release_output" != *"HTTP 404"* && "$release_output" != *"release not found"* ]]; then
              printf '%s\n' "$release_output" >&2
              echo "Could not verify whether GitHub release $RELEASE_TAG exists" >&2
              exit "$release_status"
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if tag_output=$(git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" 2>&1); then
              echo "Tag $RELEASE_TAG already exists" >&2
              exit 1
            else
              tag_status=$?
              if [ "$tag_status" -ne 2 ]; then
                printf '%s\n' "$tag_output" >&2
                echo "Could not verify whether tag $RELEASE_TAG exists" >&2
                exit "$tag_status"
              fi
            fi
          fi

      - name: Reject existing package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KALM_PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package_version in "$RELEASE_VERSION" "${RELEASE_VERSION}-full"; do
            package="@kalm-lang/specification@$package_version"
            if output=$(npm view "$package" version --registry=https://npm.pkg.github.com 2>&1); then
              echo "Package version $package already exists" >&2
              exit 1
            elif [[ "$output" == *E404* || "$output" == *"404 Not Found"* ]]; then
              continue
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done

      - name: Check package tooling and PDF layout
        run: npm test
        env:
          PDF_TEST_THEME: dark

      - name: Generate release-version PDFs
        env:
          PDF_VERSION: ${{ steps.release.outputs.pdf_version }}
        run: npm run build -- --version "$PDF_VERSION" --theme dark --theme print

      - name: Prepare focused and historical packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run build:packages -- --theme dark --theme print

      - name: Publish focused specification package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KALM_PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "generated/release-packages/versioned" --registry=https://npm.pkg.github.com

      - name: Publish historical specification package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KALM_PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "generated/release-packages/full" --registry=https://npm.pkg.github.com

      - name: Create tag for a manually started release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run release:github -- --theme dark --theme print
