name: Release specification

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional specification version in X.Y.Z format. Empty uses the latest final version.'
        required: false
        type: string
      status:
        description: 'Release status (empty or final omits a suffix; other values use -<status>).'
        required: false
        type: string
        default: 'final'

permissions:
  contents: write
  packages: write

concurrency:
  group: specification-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish specification packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js and GitHub Packages authentication
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@kalm-lang'

      - name: Install Node.js build dependencies
        run: npm install --include=dev --ignore-scripts --no-audit --no-fund

      - name: Check PDF layout and pagination
        run: npm run test:pdfs

      - name: Resolve and validate release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_STATUS: ${{ inputs.status }}
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/resolve-release-version.mjs >> "$GITHUB_OUTPUT"

      - name: Generate release-version PDFs
        env:
          PDF_VERSION: ${{ steps.release.outputs.pdf_version }}
        run: npm run build:pdfs -- --version "$PDF_VERSION"

      - name: Reject an existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for $RELEASE_TAG" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi

      - name: Reject existing package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package_version in "$RELEASE_VERSION" "${RELEASE_VERSION}-full"; do
            package="@kalm-lang/specification@$package_version"
            if output=$(npm view "$package" version --registry=https://npm.pkg.github.com 2>&1); then
              echo "Package version $package already exists" >&2
              exit 1
            elif [[ "$output" == *E404* || "$output" == *"404 Not Found"* ]]; then
              continue
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done

      - name: Prepare focused and historical packages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/build-packages.mjs

      - name: Publish focused specification package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish ".release-packages/versioned" --registry=https://npm.pkg.github.com

      - name: Publish historical specification package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish ".release-packages/full" --registry=https://npm.pkg.github.com

      - name: Create tag for a manually started release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SPECIFICATION_VERSION: ${{ steps.release.outputs.specification_version }}
          SPECIFICATION_STATUS: ${{ steps.release.outputs.status }}
        run: |
          mapfile -t SPEC_FILES < <(find .release-packages/versioned/documents -maxdepth 1 -type f -name '*.md' -print)
          if [ "${#SPEC_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one version-matched specification Markdown file; found ${#SPEC_FILES[@]}" >&2
            exit 1
          fi
          mapfile -t PDF_FILES < <(find .release-packages/versioned/pdf -maxdepth 1 -type f -name '*.pdf' -print)
          if [ "${#PDF_FILES[@]}" -ne 3 ]; then
            echo "Expected one light, dark, and print specification PDF; found ${#PDF_FILES[@]}" >&2
            exit 1
          fi

          SPEC_FILE="${SPEC_FILES[0]}"
          mapfile -t METADATA < <(node - "$SPEC_FILE" <<'NODE'
          const fs = require('node:fs');
          const { parseFrontMatter } = require('./frontmatter.cjs');
          const file = process.argv[2];
          const metadata = parseFrontMatter(fs.readFileSync(file, 'utf8'), file);
          for (const key of ['title', 'version', 'status', 'date', 'lastmod', 'javaversion', 'revision']) {
            const value = metadata[key];
            if (value === undefined || value === null || /[\r\n]/.test(String(value))) {
              throw new Error(`Missing or invalid release metadata: ${key}`);
            }
            console.log(String(value));
          }
          NODE
          )
          if [ "${#METADATA[@]}" -ne 7 ]; then
            echo "Could not read all required specification metadata" >&2
            exit 1
          fi
          SPECIFICATION_TITLE="${METADATA[0]}"
          SPECIFICATION_VERSION="${METADATA[1]}"
          SPECIFICATION_STATUS="${METADATA[2]}"
          SPECIFICATION_DATE="${METADATA[3]}"
          SPECIFICATION_LASTMOD="${METADATA[4]}"
          SPECIFICATION_JAVA_VERSION="${METADATA[5]}"
          SPECIFICATION_REVISION="${METADATA[6]}"
          SPEC_FILENAME="${SPEC_FILE##*/}"
          SPEC_BASENAME="${SPEC_FILENAME%.md}"
          METADATA_LABEL="${SPECIFICATION_VERSION} · ${SPECIFICATION_STATUS^} · ${SPECIFICATION_DATE} · Java ${SPECIFICATION_JAVA_VERSION} · Revision ${SPECIFICATION_REVISION}"
          PDF_ASSETS=()
          RELEASE_FLAGS=()
          SPECIFICATION_SUFFIX=""
          REVISION_SUFFIX=""
          if [ "$SPECIFICATION_STATUS" != "final" ]; then
            RELEASE_FLAGS+=(--prerelease)
            SPECIFICATION_SUFFIX="-$SPECIFICATION_STATUS"
          fi
          if [ "$SPECIFICATION_REVISION" -gt 1 ]; then
            REVISION_SUFFIX="-r$SPECIFICATION_REVISION"
          fi
          for theme in light dark print; do
            PDF_FILE=".release-packages/versioned/pdf/${SPEC_BASENAME}-${theme}.pdf"
            if [ ! -f "$PDF_FILE" ]; then
              echo "Missing ${theme} specification PDF: $PDF_FILE" >&2
              exit 1
            fi
            THEME_LABEL="${theme^}"
            PDF_ASSETS+=("$PDF_FILE#${SPECIFICATION_TITLE} · ${METADATA_LABEL} · ${THEME_LABEL} PDF")
          done
          NOTES=$(cat <<'EOF'
          ## SPECIFICATION_TITLE SPECIFICATION_VERSION

          | Metadata | Value |
          | --- | --- |
          | Specification version | SPECIFICATION_VERSION |
          | Status | SPECIFICATION_STATUS |
          | Date | SPECIFICATION_DATE |
          | Last modified | SPECIFICATION_LASTMOD |
          | Minimum Java version | SPECIFICATION_JAVA_VERSION |
          | Revision | SPECIFICATION_REVISION |

          The version-matched Markdown specification and its light, dark, and print PDF editions are attached below.

          ## Published packages

          - Focused: `@kalm-lang/specification@RELEASE_VERSION`
          - Historical bundle: `@kalm-lang/specification@RELEASE_VERSION-full`
          EOF
          )
          NOTES="${NOTES//SPECIFICATION_TITLE/$SPECIFICATION_TITLE}"
          NOTES="${NOTES//SPECIFICATION_VERSION/$SPECIFICATION_VERSION}"
          NOTES="${NOTES//SPECIFICATION_STATUS/$SPECIFICATION_STATUS}"
          NOTES="${NOTES//SPECIFICATION_DATE/$SPECIFICATION_DATE}"
          NOTES="${NOTES//SPECIFICATION_LASTMOD/$SPECIFICATION_LASTMOD}"
          NOTES="${NOTES//SPECIFICATION_JAVA_VERSION/$SPECIFICATION_JAVA_VERSION}"
          NOTES="${NOTES//SPECIFICATION_REVISION/$SPECIFICATION_REVISION}"
          NOTES="${NOTES//RELEASE_VERSION/$RELEASE_VERSION}"

          gh release create "$RELEASE_TAG" \
            "$SPEC_FILE#${SPECIFICATION_TITLE} · ${METADATA_LABEL} · Markdown" \
            "${PDF_ASSETS[@]}" \
            --verify-tag \
            --title "${SPECIFICATION_TITLE} ${SPECIFICATION_VERSION}${SPECIFICATION_SUFFIX}${REVISION_SUFFIX}" \
            --notes "$NOTES" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"
